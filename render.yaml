# Free pilot. Supabase is required: no disk and no SQLite fallback.
services:
  - type: web
    name: rally-pickleball
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
