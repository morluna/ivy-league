# Free pilot. Supabase is required: no disk and no SQLite fallback.
# Optional owner kill switch: set SESSION_ADMIN_KEY in Render secret settings.
services:
  - type: web
    name: rally-pickleball
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
