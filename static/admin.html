<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rally · Owner controls</title><link rel="stylesheet" href="/style.css"><script src="/admin.js" defer></script></head>
<body><header><a class="brand" href="/">◒ rally</a><span class="pill">Owner controls</span></header><main><section id="welcome"><h1>End a session</h1><p class="intro">Stop a session even if its organizer is unavailable. Its roster and schedule stay available for viewing.</p><form id="owner-end" class="panel"><label>Session link or ID<input name="session" required autocomplete="off" placeholder="Paste the session link"></label><label>Owner key<input name="owner-key" type="password" required minlength="32" autocomplete="off"></label><p class="muted">The key is used only for this request and is not saved in this browser.</p><button type="submit">End session for everyone</button></form><p id="owner-message" role="status" aria-live="polite"></p><a id="session-link" hidden>View ended session</a></section></main></body></html>
