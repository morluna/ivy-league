<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d32"><title>Rally · Pickleball together</title><link rel="stylesheet" href="/style.css"><script src="/app.js?v=4" defer></script></head>
<body><header><a href="/" class="brand">◒ rally</a><span class="pill" id="connection">Local play</span></header><main>
<section id="welcome"><form id="create" class="panel"><h2>Set up a session</h2><label>Your name<input name="name" required maxlength="40" placeholder="e.g. Marcos" autocomplete="given-name"></label><div class="fields"><label>Courts<input name="courts" type="number" value="2" min="1" max="16" required></label><label>Total minutes<input name="duration" type="number" value="120" min="1" max="480" required></label><label>Round minutes<input name="length" type="number" value="10" min="1" max="480" required></label></div><button>Create session ↗</button></form></section>
<section id="session" hidden><div class="title-row"><div><h1>Session</h1></div><button id="share" class="secondary">Share session ↗</button></div><p id="summary" class="intro"></p><div id="notice" class="notice"></div><section class="timer panel"><p id="round-label" class="eyebrow"></p><div id="countdown" aria-label="Round time remaining">00:00</div><p id="timer-state"></p><div id="controls" class="actions"></div></section><form id="join" class="panel" hidden><h2>Join the crew</h2><label>Your name<input name="name" required maxlength="40" placeholder="Name on the court"></label><button>Join session</button></form><div class="columns"><section><h2>The lineup <span id="player-count"></span></h2><div id="roster" class="panel"></div><form id="settings" class="panel" hidden><h2>Session settings</h2><div class="fields"><label>Courts<input name="courts" type="number" min="1" max="16" required></label><label>Total min<input name="duration" type="number" min="1" max="480" required></label><label>Round min<input name="length" type="number" min="1" max="480" required></label></div><button class="secondary">Save settings</button></form></section><section><h2>Court rotations</h2><div id="schedule"></div></section></div></section><p id="message" role="status" aria-live="polite"></p></main><footer>RALLY / LOCAL EDITION </footer></body></html>
