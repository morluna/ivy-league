<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d32"><title>Ivy League</title><link rel="stylesheet" href="/style.css?v=13"><script src="/app.js?v=9" defer></script></head>
<body><header><a href="/" class="brand"><svg class="brand-paddle" viewBox="0 0 32 42" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 2C8.5 2 4 6.8 4 14v5c0 5.3 3.5 8.6 8 10l1 1v8a3 3 0 0 0 6 0v-8l1-1c4.5-1.4 8-4.7 8-10v-5C28 6.8 23.5 2 16 2Z"/></svg>Ivy League</a><span class="pill" id="connection">Local play</span></header><main>
<section id="welcome"><form id="create" class="panel"><h2>Set up a session</h2><label>Your name<input name="name" required maxlength="40" placeholder="e.g. Marcos" autocomplete="given-name"></label><div class="format-field" role="group" aria-label="Format"><span class="format-label">Format</span><div class="segmented"><label><input type="radio" name="play_format" value="doubles" checked><span>Doubles</span></label><label><input type="radio" name="play_format" value="singles"><span>Singles</span></label></div></div><div class="fields"><label>Courts<input name="courts" type="number" value="2" min="1" max="16" required></label><label>Total minutes<input name="duration" type="number" value="120" min="1" max="480" required></label><label>Round minutes (optional)<input name="length" type="number" min="1" max="480"></label></div><p class="muted">Leave round minutes blank for a count-up clock and manual Next round.</p><button>Create session ↗</button></form></section>
<section id="session" hidden><div class="title-row"><div><h1>Session</h1></div><button id="share" class="secondary">Share session ↗</button></div><p id="summary" class="intro"></p><div id="notice" class="notice"></div><section class="timer panel"><p id="round-label" class="eyebrow"></p><div id="countdown" aria-label="Round time remaining">00:00</div><p id="timer-state"></p><div id="controls" class="actions"></div></section><form id="join" class="panel" hidden><h2>Join the crew</h2><label>Your name<input name="name" required maxlength="40" placeholder="Name on the court"></label><button>Join session</button></form><div class="columns"><section><h2>Players <span id="player-count"></span></h2><div id="roster" class="panel"></div><form id="add-player" class="panel" hidden><h2>Add a player</h2><label>Player name<input name="name" required maxlength="40" placeholder="Name on the court" autocomplete="off"></label><button>Add player</button><p class="muted">Updates only rounds that have not started.</p></form><form id="court-names" class="panel" hidden><h2>Court names</h2><div id="court-name-fields"></div><button class="secondary">Save court names</button></form><form id="settings" class="panel" hidden><h2>Session settings</h2><div class="format-field" role="group" aria-label="Format"><span class="format-label">Format</span><div class="segmented"><label><input type="radio" name="play_format" value="doubles" checked><span>Doubles</span></label><label><input type="radio" name="play_format" value="singles"><span>Singles</span></label></div></div><div class="fields"><label>Courts<input name="courts" type="number" min="1" max="16" required></label><label>Total min<input name="duration" type="number" min="1" max="480" required></label><label>Round min (optional)<input name="length" type="number" min="1" max="480"></label></div><button class="secondary">Save settings</button></form></section><section><h2>Court rotations</h2><div id="schedule"></div></section></div></section><p id="message" role="status" aria-live="polite"></p></main></body></html>
